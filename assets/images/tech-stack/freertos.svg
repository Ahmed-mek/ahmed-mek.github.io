<svg width="100" height="60" viewBox="0 0 100 60" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Task 1 (High Priority) -->
  <rect x="25" y="10" width="12" height="6" rx="1" fill="#FFDB6E"/>
  <rect x="58" y="10" width="15" height="6" rx="1" fill="#FFDB6E"/>
  
  <!-- Task 2 (Medium Priority) -->
  <rect x="39" y="20" width="17" height="6" rx="1" fill="#FFBC5E"/>
  <rect x="75" y="20" width="10" height="6" rx="1" fill="#FFBC5E"/>
  
  <!-- Task 3 (Low Priority/Idle) -->
  <rect x="20" y="30" width="10" height="6" rx="1" opacity="0.6" fill="#FFDB6E"/>
  <rect x="52" y="30" width="12" height="6" rx="1" opacity="0.6" fill="#FFDB6E"/>
  
  <!-- Grid Lines / Scheduling Axes -->
  <path d="M 20,8 V 38 H 85" stroke="#FFBC5E" stroke-width="1.5" stroke-linecap="round"/>
  
  <text x="50" y="57" fill="#888" font-family="sans-serif" font-size="9" text-anchor="middle">FreeRTOS</text>
</svg>
